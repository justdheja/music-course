    <path d="M98 88 Q40 200 98 312" opacity=".45"/><path d="M302 88 Q360 200 302 312" opacity=".45"/>
    <path d="M68 56 Q-12 200 68 344" opacity=".25"/><path d="M332 56 Q412 200 332 344" opacity=".25"/>
  </g>
  <!-- stand -->
  <rect x="196" y="330" width="8" height="110" fill="#17171a"/>
  <ellipse cx="200" cy="444" rx="62" ry="9" fill="#17171a"/>
